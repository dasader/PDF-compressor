worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml
        text/javascript;

    # 업로드 크기
    client_max_body_size 600M;
    client_body_timeout 600s;

    # proxy 버퍼
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;

        # 접근 제어 — 내부망에서만 호출한다는 전제.
        # 소스 IP는 보존된다 (도커 게이트웨이가 아니라 실제 클라이언트 IP가 보인다).
        # 호출 장비가 다른 대역에 생기면 여기에 allow 한 줄을 추가한다.
        allow 192.168.0.0/24;   # 사내 LAN (호출 장비들)
        allow 172.16.0.0/12;    # 같은 머신의 다른 컨테이너 (pdf-network 등)
        allow 127.0.0.1;        # 이 머신의 호스트 프로세스
        deny  all;

        # 공통 프록시 헤더 — location에서 proxy_set_header를 쓰면 상속이 끊기니 여기서만 선언한다
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 전용: 버퍼링 OFF, 장기 연결
        location ~ ^/api/jobs/[^/]+/stream$ {
            proxy_pass http://backend_upstream;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding off;
        }

        # 업로드: 요청 스트리밍 (버퍼링 OFF)
        location = /api/upload {
            proxy_pass http://backend_upstream;
            proxy_request_buffering off;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # 일반 API
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_read_timeout 1800s;
            proxy_send_timeout 1800s;
        }

        # API 문서 (backend 포트를 호스트에 열지 않으므로 진입점에서 제공)
        location ~ ^/(docs|redoc|openapi\.json) {
            proxy_pass http://backend_upstream;
        }

        # Next.js 정적 자산: 장기 캐시
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 나머지 프론트엔드
        location / {
            proxy_pass http://frontend_upstream;
        }
    }
}
