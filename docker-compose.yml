# 호스트 포트는 ../PORTS.md 규칙을 따른다 — 이 서비스는 NN=06
#   공개 진입점 nginx만 호스트에 노출한다 (8106).
#   backend/frontend/redis는 컨테이너 네트워크 안에서만 접근되므로 포트를 열지 않는다.
#   디버깅이 필요하면 `docker compose exec <서비스>` 를 쓴다.

# backend와 worker가 공유하는 빌드/환경/네트워크 설정
x-backend-base: &backend-base
  build:
    context: ./backend
    dockerfile: Dockerfile
  volumes:
    - pdf-data:/data
  networks:
    - pdf-network
  restart: unless-stopped

x-backend-env: &backend-env
  REDIS_HOST: redis
  REDIS_PORT: 6379
  UPLOAD_DIR: /data/uploads
  RESULT_DIR: /data/results
  TEMP_DIR: /data/temp
  TASK_TIMEOUT_SECONDS: 900
  LOG_LEVEL: WARNING

services:
  # Redis (메시지 브로커 & 백엔드)
  redis:
    image: redis:7-alpine
    container_name: pdf-compressor-redis
    # 영속화를 끈 상태라 볼륨이 필요 없다 (큐/결과는 휘발성)
    command: >
      redis-server
      --appendonly no
      --save ""
      --maxmemory 384mb
      --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # 백엔드 (FastAPI)
  backend:
    <<: *backend-base
    container_name: pdf-compressor-backend
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: 2
      MAX_UPLOAD_SIZE_MB: 512
      CORS_ORIGINS: http://localhost:8106,http://localhost
    healthcheck:
      # start_period가 기동을 덮으므로 이후에는 자주 찌를 이유가 없다 (파이썬 기동 비용 절감)
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/readyz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 640M
        reservations:
          memory: 256M

  # Celery 워커 (Beat 내장)
  worker:
    <<: *backend-base
    container_name: pdf-compressor-worker
    entrypoint: ["/worker-entrypoint.sh"]
    environment:
      <<: *backend-env
    healthcheck:
      # celery inspect는 앱 전체를 import하므로 비싸다 — 간격을 넉넉히 둔다
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping --timeout 5"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M

  # 프론트엔드 (Next.js) - 프로덕션
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf-compressor-frontend
    environment:
      - NEXT_PUBLIC_API_URL=
    depends_on:
      - backend
    networks:
      - pdf-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx (리버스 프록시)
  nginx:
    image: nginx:alpine
    container_name: pdf-compressor-nginx
    ports:
      - "8106:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pdf-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  pdf-data:

networks:
  pdf-network:
    driver: bridge
